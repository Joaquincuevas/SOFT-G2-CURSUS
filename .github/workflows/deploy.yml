name: Deploy

# Cada push (cada merge) publica la imagen del backend en ECR y, si el entorno
# está encendido, la despliega: migraciones, actualización del servicio y
# verificación de /api/health/db. develop se despliega en staging y main en
# production. Con el entorno apagado termina en verde con un aviso; al encender
# se usa la última imagen. Ver infra/aws/.

on:
  push:
    branches: [develop, main]
  # El botón manual aparece cuando este archivo llega a la rama por defecto.
  workflow_dispatch:

# Un deploy a la vez por entorno: el siguiente espera, no cancela al que está en curso.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Espera a que el CI (ci.yml) del mismo commit termine. Solo se despliega lo
  # que pasó lint, test, build e image.
  esperar-ci:
    name: esperar-ci
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      checks: read
    outputs:
      ci: ${{ steps.ci.outputs.resultado }}
    steps:
      - name: Esperar lint, test, build e image
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # $c es una variable de jq, no de bash.
          # shellcheck disable=SC2016
          for _ in $(seq 1 60); do
            resultado=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '
              [.check_runs[] | select(.name == "lint" or .name == "test" or .name == "build" or .name == "image")] as $c
              | if ($c | length) < 4 or any($c[]; .status != "completed") then "pendiente"
                elif any($c[]; .conclusion == "cancelled") then "cancelado"
                elif all($c[]; .conclusion == "success") then "ok"
                else "fallo" end')
            echo "CI: $resultado"
            if [ "$resultado" != pendiente ]; then
              echo "resultado=$resultado" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 30
          done
          case "$resultado" in
            ok) ;;
            cancelado)
              echo "::notice title=Deploy omitido::El CI de este commit se canceló porque llegó un push más nuevo; ese push hará el deploy."
              ;;
            fallo)
              echo "::error title=CI en rojo::No se despliega un commit que no pasó el CI."
              exit 1
              ;;
            *)
              echo "::error title=CI sin terminar::El CI no terminó en 30 minutos."
              exit 1
              ;;
          esac

  deploy:
    name: deploy
    needs: esperar-ci
    # Solo develop y main tienen entorno; el disparo manual en otra rama no despliega.
    if: ${{ !cancelled() && (github.ref_name == 'develop' || github.ref_name == 'main') && (github.event_name == 'workflow_dispatch' || needs.esperar-ci.outputs.ci == 'ok') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    # Con llaves no se necesita id-token. Si se vuelve a OIDC (plan de pago),
    # agregar "id-token: write".
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      TAG: ${{ github.sha }}
      # URL del frontend en Vercel (variable del environment de GitHub; opcional).
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      # Mismo criterio que infra/aws/cursus.yml: staging conserva su nombre original.
      REPOSITORY: ${{ github.ref_name == 'main' && 'cursus-backend-production' || 'cursus-backend' }}
      # Los secretos no se pueden usar directo en un if: se resume en un valor
      # que no es secreto.
      USA_LLAVES: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      # Plan gratuito de AWS (bloquea OIDC): llaves del usuario cursus-<entorno>-github.
      - name: Entrar a AWS con llaves de acceso
        if: env.USA_LLAVES == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Plan de pago: sin llaves, GitHub asume el rol de AWS con OIDC.
      - name: Entrar a AWS con OIDC
        if: env.USA_LLAVES != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # Las etiquetas de ECR no se pueden sobrescribir: al reintentar un commit
      # ya publicado se reutiliza su imagen.
      - name: Revisar si la imagen ya existe
        id: imagen
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          fi

      # La imagen base viene de ECR Public. Sin sesión, las descargas tienen un
      # límite por IP que los runners de GitHub comparten ("toomanyrequests:
      # Data limit exceeded"). ECR Public entrega credenciales solo en us-east-1.
      - name: Entrar a ECR Public
        if: steps.imagen.outputs.existe != 'true'
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        with:
          registry-type: public

      - uses: docker/setup-buildx-action@v4
        if: steps.imagen.outputs.existe != 'true'

      - name: Construir y publicar la imagen
        if: steps.imagen.outputs.existe != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Revisar si el entorno está encendido
        id: estado
        run: echo "estado=$(bash infra/aws/status.sh "$ENVIRONMENT")" >> "$GITHUB_OUTPUT"

      - name: Entorno apagado
        if: steps.estado.outputs.estado != 'encendido'
        run: |
          echo "::notice title=$ENVIRONMENT apagado::Imagen $TAG publicada en ECR. Se desplegará al encender el entorno (infra/aws/start.sh $ENVIRONMENT)."

      - name: Desplegar
        if: steps.estado.outputs.estado == 'encendido'
        run: bash infra/aws/deploy.sh "$ENVIRONMENT" "$TAG"

      # Solo avisa, no falla: Vercel despliega en paralelo y puede tardar más que
      # este workflow. Comprueba que el frontend llegue a la API con el header
      # secreto (variables API_URL y ORIGIN_SECRET de Vercel).
      - name: Verificar el frontend en Vercel
        if: steps.estado.outputs.estado == 'encendido' && env.FRONTEND_URL != ''
        run: |
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$FRONTEND_URL/api/health/db" || true)
            if [ "$code" = 200 ]; then
              echo "El frontend responde en $FRONTEND_URL/api/health/db"
              exit 0
            fi
            sleep 15
          done
          echo "::warning title=Frontend sin verificar::$FRONTEND_URL/api/health/db respondió $code en vez de 200. Revisa el deploy de Vercel y sus variables API_URL y ORIGIN_SECRET (un 401 indica que el dominio tiene Deployment Protection)."
