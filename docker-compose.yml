# Entorno local de desarrollo. Las credenciales se leen desde .env (ver .env.example).
name: cursus

services:
  postgres:
    image: postgres:17-alpine
    container_name: cursus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cursus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta el archivo .env, copia .env.example a .env}
      POSTGRES_DB: ${POSTGRES_DB:-cursus}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
