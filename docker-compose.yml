# Entorno local de desarrollo. Las credenciales se leen desde .env (ver .env.example).
name: cursus

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: cursus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cursus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta el archivo .env, copia .env.example a .env}
      POSTGRES_DB: ${POSTGRES_DB:-cursus}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 local para los archivos de los cursos (MAT-01). Versión fija: las más
  # nuevas de LocalStack piden una cuenta. Al arrancar crea el bucket
  # (infra/localstack/crear-bucket.sh); los archivos se pierden al reiniciar.
  s3:
    image: localstack/localstack:4.9.2
    container_name: cursus-s3
    restart: unless-stopped
    environment:
      SERVICES: s3
      S3_BUCKET: ${S3_BUCKET:-cursus-archivos}
    ports:
      - '127.0.0.1:${S3_PORT:-4566}:4566'
    volumes:
      - ./infra/localstack/crear-bucket.sh:/etc/localstack/init/ready.d/crear-bucket.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3api head-bucket --bucket $${S3_BUCKET}']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
